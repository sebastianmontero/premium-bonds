name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  smart-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Format Check
        run: cargo fmt --manifest-path anchor/Cargo.toml -- --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path anchor/Cargo.toml -- -D warnings

      - name: Cargo Test
        run: cargo test --manifest-path anchor/Cargo.toml
