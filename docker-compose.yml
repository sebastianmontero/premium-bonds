services:
  postgres:
    image: postgres:16-alpine
    container_name: pb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pb_postgres_data:/var/lib/postgresql/data

volumes:
  pb_postgres_data:
